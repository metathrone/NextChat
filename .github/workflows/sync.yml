name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ChatGPTNextWeb/NextChat.git 2>/dev/null || true
          git fetch upstream main
          if git merge -X ours upstream/main -m "chore: sync upstream changes" --no-edit; then
            echo "Merged upstream changes successfully"
          else
            echo "Conflicts detected, resolving with ours..."
            git checkout --ours .github/workflows/ || true
            git add -A
            git commit -m "chore: sync upstream changes" || true
          fi
          git push origin main
